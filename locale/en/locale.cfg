address-tooltip=Where this loader sends what it holds: the nearest unloader on its chain network whose name matches. * matches anything ("smelt*" finds smelter-1); case doesn't matter.\nEmpty: it supplies the chests that ask, like a passive provider chest.
title-post=Chain post name
ride-title=Riding the chain
ride-hint=Walking keys pick the way at each post. Click a name to ride there.
ride-none=No named posts or unloaders on this chain network yet. Click a post to name it.
ride-off=Get off
ride-off-tooltip=Drops you under the chain (or press the vehicle key again).
ride-to-post=Ride to this chain post (the shortest way)
ride-to-unloader=Ride to the post by this unloader (the shortest way)
ride-arrived=Arrived
