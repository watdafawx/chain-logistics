[mod-setting-description]
chl-skin=The colours of the posts, chains and packages.
chl-package-size=Multiplies how many items a package holds (8, 15 and 30 at the three tiers: a post sends about a yellow, red or blue belt's worth, 15, 30 or 45 items a second).
chl-share-with-bots=Off: a requester or buffer chest inside a logistic network with robots is left to the robots (they can't see packages on the way, so both would deliver). On: chains help too, and may deliver a little extra.
chl-chests-per-tick=How many logistic chests the chains look at each tick. Higher reacts faster in big bases, at more script time.

[string-mod-setting]
chl-skin-magenta=Magenta + cyan
chl-skin-toxic=Toxic green + yellow
chl-skin-orange=Orange + blue
chl-skin-red=Red + white

[controls]
chl-open=Open a chain post
chl-ride=Ride a chain

[item-description]
chl-chain-post=Carries packages on an overhead chain. Links to the nearest post within 16 tiles.\nServes the logistic chests next to it: requester and buffer chests get what they ask for from provider and storage chests anywhere on its chain network, like logistic robots would.
chl-chain-pulley=Bends a chain line: links to the nearest post or pulley within 16 tiles, and the chain wraps round it. Packages pass without stopping. Serves no chests; a span to it runs at the other end's tier.
chl-loader=Inserters fill it; its post ships what it holds. With an address it sends to the unloaders of that name, else it supplies the chests that ask for its items (like a passive provider).
chl-unloader=A requester chest for the chains: it gets what it asks for, and what loaders send to its name. Inserters take it out.

[chl]
post-for=Chain post (__1__)
