[mod-setting-description]
chl-skin=The colours of the posts, chains and packages.
chl-package-size=Multiplies how many items a package holds (8 at the first tier: a post sends about a yellow belt's worth, 15 items a second).
chl-share-with-bots=Off: a requester or buffer chest inside a logistic network with robots is left to the robots (they can't see packages on the way, so both would deliver). On: chains help too, and may deliver a little extra.
chl-chests-per-tick=How many logistic chests the chains look at each tick. Higher reacts faster in big bases, at more script time.

[string-mod-setting]
chl-skin-magenta=Magenta + cyan
chl-skin-toxic=Toxic green + yellow
chl-skin-orange=Orange + blue
chl-skin-red=Red + white

[item-description]
chl-chain-post=Carries packages on an overhead chain. Links to the nearest post within 16 tiles.\nServes the logistic chests next to it: requester and buffer chests get what they ask for from provider and storage chests anywhere on its chain network, like logistic robots would.
